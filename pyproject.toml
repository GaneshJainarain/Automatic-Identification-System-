[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kad"
version = "0.1.0"
description = "Kinematic anomaly detection on AIS vessel tracks"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "pyarrow",
    "requests",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
kad = "kad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
